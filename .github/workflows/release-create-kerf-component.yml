name: Release create-kerf-component

# Triggered by the same `v*` tag patterns as the kerfjs core release workflow.
# create-kerf-component releases in lockstep with kerfjs — a `v{X}.{Y}.{Z}` tag
# fires the four lockstep release workflows, including this one. The npm
# Trusted Publisher rule for the package is `v*`, so the OIDC ref pattern
# accepts the same tags.
#
# Stable lockstep is committed by scripts/release.sh; beta tag metadata is
# applied to the final tarball by scripts/prepare-release-package.mjs in the
# tokenless `pack` job below.

# Least-privilege baseline: read-only contents, no OIDC token for any job.
# `id-token: write` (npm OIDC trusted publishing) is granted ONLY to the
# `npm-publish` job, keeping the OIDC-mintable token out of the `test` job that
# runs untrusted install scripts / test code via `npm ci` / `npm test`.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

concurrency:
  group: release-create-kerf-component-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Pinned to 22.21.0 — matches release.yml. See the comment there for the
  # Node 22.22.2 / arborist breakage that motivated the pin.
  NODE_VERSION: '22.21.0'
  # Bundles npm 11.6.2, so the OIDC job needs no registry install before
  # trusted publishing (npm >= 11.5.1).
  PUBLISH_NODE_VERSION: '24.12.0'

jobs:
  # ─── Phase 1: validate the initializer ──────────────────────────────

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-kerf-component
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: create-kerf-component/package-lock.json
      - run: npm ci
      - run: npm test

  # ─── Detect: stable or beta? ────────────────────────────────────────

  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_beta: ${{ steps.extract.outputs.is_beta }}
    steps:
      - id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-beta.* ]]; then
            IS_BETA=true
          else
            IS_BETA=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"
          echo "Releasing create-kerf-component v$VERSION (beta: $IS_BETA)"

  # ─── Phase 2: pack without a token, then publish exact bytes ────────
  #
  # No GitHub-release job here — the kerfjs core release.yml is the single
  # source for the GitHub Release on each tag. This workflow only owns the
  # create-kerf-component npm publish.

  pack:
    needs: [test, detect]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-kerf-component
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - name: Prepare exact release metadata
        run: node ../scripts/prepare-release-package.mjs create-kerf-component "${{ needs.detect.outputs.version }}"
      - name: Pack the exact artifact for the publish job
        run: |
          mkdir -p "$RUNNER_TEMP/release-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-package"
      - name: Upload packed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: create-kerf-component-package
          path: ${{ runner.temp }}/release-package/*.tgz
          retention-days: 1
          if-no-files-found: error

  npm-publish:
    needs: [pack, detect]
    runs-on: ubuntu-latest
    environment: npm-publish-create-kerf-component
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '${{ env.PUBLISH_NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org/'
      - name: Download the packed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: create-kerf-component-package
          path: release-package/
      - name: Publish to npm@latest (stable)
        if: needs.detect.outputs.is_beta == 'false'
        run: npm publish ./release-package/*.tgz --ignore-scripts --provenance --access public
      - name: Publish to npm@beta (beta)
        if: needs.detect.outputs.is_beta == 'true'
        run: npm publish ./release-package/*.tgz --ignore-scripts --tag beta --provenance --access public
