name: Release @kerfjs/ui

# @kerfjs/ui shares kerfjs's v* tags and version. Stable manifests are bumped
# together by scripts/release.sh; beta metadata is applied to the final
# tarball in the tokenless validation/build job below.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

concurrency:
  group: release-ui-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.21.0'
  # Bundles npm 11.6.2, so the OIDC job needs no registry install before
  # trusted publishing (npm >= 11.5.1).
  PUBLISH_NODE_VERSION: '24.12.0'

jobs:
  validate-and-build:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: ui
      - name: Install Playwright browsers required by the UI check
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - name: Prepare exact release metadata
        run: node scripts/prepare-release-package.mjs @kerfjs/ui "${{ needs.detect.outputs.version }}"
      - name: Pack the exact artifact for the publish job
        run: |
          mkdir -p "$RUNNER_TEMP/release-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-package"
        working-directory: ui
      - name: Upload packed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kerfjs-ui-package
          path: ${{ runner.temp }}/release-package/*.tgz
          retention-days: 1
          if-no-files-found: error

  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_beta: ${{ steps.extract.outputs.is_beta }}
    steps:
      - id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-beta.* ]]; then IS_BETA=true; else IS_BETA=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"

  npm-publish:
    needs: [validate-and-build, detect]
    runs-on: ubuntu-latest
    environment: npm-publish-ui
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ env.PUBLISH_NODE_VERSION }}'
          registry-url: 'https://registry.npmjs.org/'
      - name: Download the packed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kerfjs-ui-package
          path: release-package/
      - name: Publish stable
        if: needs.detect.outputs.is_beta == 'false'
        run: npm publish ./release-package/*.tgz --ignore-scripts --provenance --access public
      - name: Publish beta
        if: needs.detect.outputs.is_beta == 'true'
        run: npm publish ./release-package/*.tgz --ignore-scripts --tag beta --provenance --access public
