# KF-1XBJDT: predeclared controls, never canonical scheduling or retries.
name: Library same-runner contention diagnostic
on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact candidate; controller stays at dispatched workflow revision
        required: true
        type: string
        default: cc06dcc779c596f0bd1e012adc91504886275bb8
permissions:
  contents: read
jobs:
  same-runner-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Validate candidate revision
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
      - name: Assert pinned contributor toolchain
        run: node --input-type=module -e "import assert from 'node:assert/strict';import{execFileSync}from'node:child_process';assert.equal(process.version,'v22.23.4');assert.equal(execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),'10.9.9');"
      - run: npm ci
        working-directory: target
      - run: npm run build
        working-directory: target
      - run: npm ci && npm run build
        working-directory: target/ui
      - run: npm ci
        working-directory: target/editor
      - name: Configure bounded HTTPS browser dependencies
        timeout-minutes: 2
        run: sudo "$(command -v node)" "$GITHUB_WORKSPACE/target/scripts/configure-browser-apt.mjs"
      - name: Install selected exact browser
        timeout-minutes: 15
        working-directory: target/editor
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx --no-install playwright install --with-deps "$BROWSER"
      - name: Execute every predeclared same-VM cell
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          BROWSER: ${{ matrix.browser }}
        run: node harness/scripts/library-contention-probe.mjs target "$RUNNER_TEMP/library-contention/$BROWSER" "$BROWSER"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-contention-${{ matrix.browser }}-${{ inputs.source-sha }}
          path: ${{ runner.temp }}/library-contention/${{ matrix.browser }}
          if-no-files-found: warn
