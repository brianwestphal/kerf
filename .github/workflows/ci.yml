name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --config vitest.config.dist.ts
      - run: npx vitest run --config vitest.config.dist-full.ts
      - run: npm pack --dry-run

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: site
      - name: Audit all site build dependencies (high and critical)
        working-directory: site
        run: npm run --silent check:audit
      - name: Build site and reject route-collision warnings
        working-directory: site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/kerf-site-build.log"
          node ../scripts/check-site-build-output.mjs < "$RUNNER_TEMP/kerf-site-build.log"

  # The plugin's peerDependencies range is a TESTED range: every ESLint major
  # it names is exercised here. Adding a major to the range means adding it to
  # this matrix in the same commit — see CLAUDE.md § "The eslint-plugin peer
  # range is a tested range".
  eslint-plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ['9.39.5', '10.8.0']
    defaults:
      run:
        working-directory: eslint-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          {
            node-version: '${{ env.NODE_VERSION }}',
            cache: npm,
            cache-dependency-path: eslint-plugin/package-lock.json,
          }
      - run: npm ci
      # --no-save so the committed lockfile stays the source of truth for every
      # other dependency; only ESLint itself varies across the matrix.
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: node -e "console.log('eslint', require('eslint').ESLint.version)"
      - run: npm test

  create-kerf-component:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-kerf-component
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          {
            node-version: '${{ env.NODE_VERSION }}',
            cache: npm,
            cache-dependency-path: create-kerf-component/package-lock.json,
          }
      - run: npm ci
      - run: npm test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install kerfjs build dependencies
        working-directory: .
        run: npm ci
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - run: npm ci
      - run: npm run build
      - run: npm run check

  # Run the full browser suite in each engine concurrently. The package check
  # remains the stable `ui` status check; each browser reports its own result.
  ui-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install kerfjs build dependencies
        working-directory: .
        run: npm ci
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - run: npm ci
      - name: Cache UI Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-ui-${{ matrix.browser }}-${{ runner.os }}-
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - name: Run UI browser tests
        id: ui_browser
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload failed UI browser evidence
        if: ${{ !cancelled() && steps.ui_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-browser-failure-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/playwright-report/
            ui/test-results/**/trace.zip
            ui/test-results/**/test-failed-*.png
            ui/test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14

  # KF-MCM28T / KF-V4C43T: re-render every design template in the browser and
  # fail on visual drift (a component changed but its template was not
  # regenerated). Keep this exact-render comparison on macOS: the committed
  # system-font SVGs use macOS font metrics, so comparing Linux renders makes
  # every template appear to drift even when its component is unchanged.
  design-templates:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install kerfjs build dependencies
        working-directory: .
        run: npm ci
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run check:design-templates:drift

  # KF-118: browser tests run on every push/PR alongside the unit suites.
  # The happy-dom unit tests can't model SVG/MathML namespacing, IME
  # composition, or real mutation counts — Playwright covers those cases
  # against chromium / firefox / webkit. The browser-binary download is
  # cached against package-lock.json so warm runs reuse it.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
