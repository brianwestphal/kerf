  contents: read
env:
  NODE_VERSION: '22'
  BUN_QUALIFICATION_EVIDENCE: /tmp/kerf-bun-qualification
  BUN_INSTALL_CACHE_DIR: /tmp/kerf-bun-cache
  BUN_QUALIFICATION_CI_SHA256: 84e761644df75064e403d591a7a279dc57039f0a01e22af2ce131d4cf6e12197
