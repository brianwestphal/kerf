# Generated from ci.yml by scripts/sync-bun-qualification-workflow.mjs.
# Manual qualification only; production installation and publishing remain npm.
name: Bun candidate qualification
on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Exact 40-character source SHA for the isolated npm performance control
        type: string
        required: false
      scope:
        description: Qualification scope (full retains every canonical lane)
        type: choice
        options:
          - full
          - release-artifacts
          - dependency-variations
          - browser-apt
          - pure-wasi
          - local-peer
          - stable-plan
          - bundled-dependency
          - library-performance
        default: full
permissions:
  contents: read
env:
  NODE_VERSION: '22'
  BUN_QUALIFICATION_EVIDENCE: /tmp/kerf-bun-qualification
  BUN_INSTALL_CACHE_DIR: /tmp/kerf-bun-cache
  BUN_QUALIFICATION_CI_SHA256: 8b0e3406ea65dde428ed87f80fa2f85a77fb05347b09c411195a5782409eea9b
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm test
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm run lint
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm run typecheck
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm run build
      - run: npx --no-install vitest run --config vitest.config.dist.ts
      - run: npx --no-install vitest run --config vitest.config.dist-full.ts
      - run: npm pack --dry-run
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  node-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm run build
      - name: Pack kerfjs
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '18'
      - name: Install the tarball into a scratch consumer on Node 18
        run: |
          node --version
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/kerfjs-*.tgz
      - name: Run the kerfjs setup dry run on Node 18
        working-directory: ${{ runner.temp }}/consumer
        run: npx --no-install kerfjs setup --core --resolve 'package.json#dependencies.kerfjs=keep'
      - name: Render on the server from dist on Node 18
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module -e "
            import { renderDocument, signal } from 'kerfjs';
            import { jsx } from 'kerfjs/jsx-runtime';
            const count = signal(2);
            const page = jsx('html', { children: jsx('body', { children: jsx('p', { class: 'n', children: ['Count: ', count.value] }) }) });
            const out = renderDocument(page);
            const expected = '<!DOCTYPE html><html><body><p class=\"n\">Count: 2</p></body></html>';
            if (out !== expected) { console.error('unexpected SSR output:', out); process.exit(1); }
            console.log(out);
          "
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" site
      - name: Run the check:core gates no other job covers
        run: node scripts/run-check-steps.mjs check:core --skip lint,typecheck,test,vitest:dist,vitest:dist-full,check-package-gates
      - name: Audit the published dependency tree (high and critical)
        run: npm run --silent check:audit
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm run build
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" site
        working-directory: site
      - name: Audit all site build dependencies (high and critical)
        working-directory: site
        run: npm run --silent check:audit
      - name: Build site and reject route-collision warnings
        working-directory: site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/kerf-site-build.log"
          node ../scripts/check-site-build-output.mjs < "$RUNNER_TEMP/kerf-site-build.log"
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  eslint-plugin:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eslint:
          - 9.39.5
          - 10.8.0
    defaults:
      run:
        working-directory: eslint-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: eslint-plugin/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" eslint-plugin
      - run: npm run lint
      - run: bun add --no-save eslint@${{ matrix.eslint }} && bun pm ls --all > "$BUN_QUALIFICATION_EVIDENCE/eslint-plugin-final-lock-view.txt" && node "$GITHUB_WORKSPACE/scripts/bun-installed-inventory.mjs" . "$BUN_QUALIFICATION_EVIDENCE/eslint-plugin-final-installed.json" --expect eslint@${{ matrix.eslint }} && cp bun.lock "$BUN_QUALIFICATION_EVIDENCE/eslint-plugin-final.bun.lock" && cp package.json "$BUN_QUALIFICATION_EVIDENCE/eslint-plugin-final-package.json"
      - run: node -e "console.log('eslint', require('eslint').ESLint.version)"
      - run: npm run check
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' || inputs.scope == 'dependency-variations' }}
  create-kerf-component:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: create-kerf-component
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: create-kerf-component/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" create-kerf-component
      - run: npm run lint
      - run: npm test
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - name: Install kerfjs build dependencies
        working-directory: .
        run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" ui
      - name: Cache UI Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-ui-${{ runner.os }}-
      - name: Configure bounded HTTPS browser dependencies
        timeout-minutes: 2
        run: |
          sudo "$(command -v node)" "$GITHUB_WORKSPACE/scripts/configure-browser-apt.mjs"
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
        timeout-minutes: 15
      - run: npm run build
      - run: npm run check
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - name: Install kerfjs build dependencies
        working-directory: .
        run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - name: Install and build @kerfjs/ui
        working-directory: ui
        run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" ui && npm run build
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" editor
      - run: npm run check
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  editor-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
        shard:
          - 1
          - 2
          - 3
          - 4
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - name: Install kerfjs build dependencies
        working-directory: .
        run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - name: Install and build @kerfjs/ui
        working-directory: ui
        run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" ui && npm run build
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" editor
      - name: Configure bounded HTTPS browser dependencies
        timeout-minutes: 2
        run: |
          sudo "$(command -v node)" "$GITHUB_WORKSPACE/scripts/configure-browser-apt.mjs"
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 15
      - name: Run editor browser tests
        id: editor_browser
        run: npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4 --workers=3 --test-list-invert=tests/library-performance.exclude --output=test-results-functional
      - name: Measure Library disclosure without competing test workers
        id: library_performance
        if: ${{ !cancelled() && matrix.shard == 3 && (steps.editor_browser.outcome == 'success' || steps.editor_browser.outcome == 'failure') }}
        run: npm run test:e2e -- tests/browser/library-performance.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0 --output=test-results-performance
      - name: Retain every Library performance result
        if: ${{ !cancelled() && matrix.shard == 3 && (steps.library_performance.outcome == 'success' || steps.library_performance.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-library-performance-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: editor/test-results-performance
          if-no-files-found: warn
      - name: Upload failed editor browser evidence
        if: ${{ !cancelled() && steps.editor_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-browser-failure-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            editor/test-results-functional/**/trace.zip
            editor/test-results-functional/**/test-failed-*.png
            editor/test-results-functional/**/error-context.md
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
  ui-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - name: Install kerfjs build dependencies
        working-directory: .
        run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - name: Build the local kerfjs peer
        working-directory: .
        run: npm run build
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" ui
      - name: Cache UI Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-ui-${{ matrix.browser }}-${{ runner.os }}-
      - name: Configure bounded HTTPS browser dependencies
        timeout-minutes: 2
        run: |
          sudo "$(command -v node)" "$GITHUB_WORKSPACE/scripts/configure-browser-apt.mjs"
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 15
      - run: npm run build
      - name: Run UI browser tests
        id: ui_browser
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload failed UI browser evidence
        if: ${{ !cancelled() && steps.ui_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-browser-failure-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/playwright-report/
            ui/test-results/**/trace.zip
            ui/test-results/**/test-failed-*.png
            ui/test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
    if: ${{ inputs.scope == 'full' }}
