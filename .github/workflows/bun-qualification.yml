      - run: npx --no-install vitest run --config vitest.config.dist-full.ts
      - run: npm pack --dry-run
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
  node-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the exact candidate installer (not repository dependencies)
        working-directory: .
        run: npm install --global bun@1.4.4
      - run: node "$GITHUB_WORKSPACE/scripts/bun-candidate-install.mjs" .
      - run: npm run build
      - name: Pack kerfjs
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '18'
      - name: Install the tarball into a scratch consumer on Node 18
        run: |
          node --version
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/kerfjs-*.tgz
      - name: Run the kerfjs setup dry run on Node 18
        working-directory: ${{ runner.temp }}/consumer
        run: npx --no-install kerfjs setup --core --resolve 'package.json#dependencies.kerfjs=keep'
      - name: Render on the server from dist on Node 18
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module -e "
            import { renderDocument, signal } from 'kerfjs';
            import { jsx } from 'kerfjs/jsx-runtime';
            const count = signal(2);
            const page = jsx('html', { children: jsx('body', { children: jsx('p', { class: 'n', children: ['Count: ', count.value] }) }) });
            const out = renderDocument(page);
            const expected = '<!DOCTYPE html><html><body><p class=\"n\">Count: 2</p></body></html>';
            if (out !== expected) { console.error('unexpected SSR output:', out); process.exit(1); }
            console.log(out);
          "
      - name: Retain exact candidate locks and input manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ env.BUN_QUALIFICATION_EVIDENCE }}
          if-no-files-found: warn
